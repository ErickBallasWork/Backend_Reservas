# Integración continua del backend en Azure DevOps (DO-05).
# Corre en cada push a develop o main. Para validar cada Pull Request, en Azure Repos se configura
# una "Build validation" en las políticas de rama de develop y main que use este mismo pipeline
# (Azure Repos no usa la sección "pr:" del YAML).

trigger:
  branches:
    include:
      - develop
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: 'Node.js 22'
    inputs:
      versionSpec: '22.x'

  - script: npm ci
    displayName: 'Instalar dependencias (incluye prisma generate)'

  - script: npm test -- --ci
    displayName: 'Pruebas unitarias'

  - script: npm run build
    displayName: 'Compilar'

  - script: npm audit --omit=dev --audit-level=high
    displayName: 'Revisar vulnerabilidades (DO-06)'
    continueOnError: true

# Siguiente etapa (DO-08, DO-10): construir la imagen Docker, subirla a GitHub Container Registry,
# aplicar migraciones de Prisma con el usuario de migraciones y publicar en Container Apps.
