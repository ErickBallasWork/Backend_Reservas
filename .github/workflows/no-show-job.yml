name: No-show job

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: no-show-job
  cancel-in-progress: false

jobs:
  run:
    name: Mark no-shows and expire pending trainings
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the job endpoint
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          JOB_KEY: ${{ secrets.JOB_KEY }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$JOB_KEY" ]; then
            echo "API_BASE_URL variable and JOB_KEY secret are required" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 60 --retry 2 --retry-delay 5 \
            --request POST \
            --header "x-job-key: $JOB_KEY" \
            "${API_BASE_URL%/}/api/v1/sanctions/no-show/run"
